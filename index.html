<style>
:root{--bg:#080808;--bg1:#111;--bg2:#1a1a1a;--bg3:#242424;
--or:#FF4D00;--ye:#C8FF00;--wh:#F0F0F0;--gr:#555;--bd:#252525;
--bl:#4D9FFF;--gn:#18C87A;--pk:#FF4DA0;--pu:#9B59B6;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--wh);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;min-height:100vh;}
#app{max-width:500px;margin:0 auto;padding-bottom:88px;}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;background:var(--bg1);border-top:1px solid var(--bd);display:flex;z-index:99;}
.nav-btn{flex:1;padding:11px 4px 9px;border:none;background:none;color:var(--gr);font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;}
.nav-btn .ico{font-size:18px;}
.nav-btn.active{color:var(--or);}

/* PROFILE HEADER */
.profile-hdr{background:linear-gradient(135deg,#141414,#1c1000);padding:20px 16px 18px;border-bottom:1px solid var(--bd);}
.avatar-row{display:flex;align-items:center;gap:14px;margin-bottom:14px;}
.avatar-wrap{position:relative;width:66px;height:66px;flex-shrink:0;}
.avatar{width:66px;height:66px;border-radius:50%;border:3px solid var(--or);object-fit:cover;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer;}
.avatar-edit{position:absolute;bottom:-2px;right:-2px;width:22px;height:22px;background:var(--or);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;border:2px solid var(--bg);}
.profile-info{flex:1;}
.profile-name{font-size:19px;font-weight:800;letter-spacing:-.02em;}
.profile-level{font-size:10px;color:var(--or);text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin-top:2px;}
.profile-days{font-size:10px;color:var(--gr);margin-top:2px;}
.streak-box{text-align:center;background:var(--bg2);border-radius:10px;padding:6px 10px;border:1px solid var(--bd);}
.streak-val{font-size:18px;font-weight:800;color:var(--ye);}
.streak-lbl{font-size:7px;color:var(--gr);text-transform:uppercase;}
.mini-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
.mini-stat{background:var(--bg2);border-radius:9px;padding:8px 6px;text-align:center;border:1px solid var(--bd);}
.mini-stat-val{font-size:16px;font-weight:800;}
.mini-stat-lbl{font-size:8px;color:var(--gr);text-transform:uppercase;margin-top:1px;}

/* TABS */
.tabs{display:flex;gap:5px;margin:12px 12px 0;overflow-x:auto;}
.tab{flex:0 0 auto;padding:7px 13px;background:var(--bg2);border:1px solid var(--bd);border-radius:9px;font-size:11px;font-weight:700;color:var(--gr);cursor:pointer;}
.tab.active{background:var(--or);color:#fff;border-color:var(--or);}

/* LOG WORKOUT */
.card{margin:10px 12px 0;background:var(--bg1);border-radius:13px;padding:14px 15px;border:1px solid var(--bd);}
.card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--gr);margin-bottom:10px;}
.exo-select{width:100%;background:var(--bg2);border:1.5px solid var(--bd);border-radius:9px;color:var(--wh);font-size:13px;padding:10px 12px;margin-bottom:8px;}
.log-row{display:grid;grid-template-columns:36px 1fr 1fr auto;gap:6px;align-items:center;margin-bottom:8px;}
.log-input{background:var(--bg2);border:1.5px solid var(--bd);border-radius:8px;color:var(--ye);font-size:14px;font-weight:700;text-align:center;padding:8px 4px;-moz-appearance:textfield;}
.log-input::-webkit-outer-spin-button,.log-input::-webkit-inner-spin-button{-webkit-appearance:none;}
.log-input:focus{outline:none;border-color:var(--or);}
.log-del{width:30px;height:30px;background:var(--bg2);border:1px solid var(--bd);border-radius:8px;color:#c00;font-size:14px;cursor:pointer;}
.log-lbls{display:grid;grid-template-columns:36px 1fr 1fr auto;gap:6px;margin-bottom:4px;}
.log-lbl{font-size:8px;color:var(--gr);text-align:center;text-transform:uppercase;}
.btn{width:100%;padding:12px;border:none;border-radius:11px;font-size:14px;font-weight:800;cursor:pointer;margin-top:8px;}
.btn-or{background:var(--or);color:#fff;}
.btn-ye{background:var(--ye);color:#000;}
.btn-ghost{background:var(--bg2);color:var(--gr);border:1px solid var(--bd);font-size:12px;padding:9px;}
.pr-badge{display:inline-flex;align-items:center;gap:4px;background:#1a1400;color:var(--ye);font-size:10px;font-weight:800;padding:4px 9px;border-radius:20px;border:1px solid var(--ye)44;margin-top:6px;}

/* HISTORY LIST */
.hist-day-card{margin:0 12px 8px;background:var(--bg1);border-radius:12px;border:1px solid var(--bd);overflow:hidden;}
.hist-day-hdr{padding:11px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
.hist-day-title{font-size:13px;font-weight:700;}
.hist-day-date{font-size:10px;color:var(--gr);}
.hist-day-vol{font-size:11px;color:var(--ye);font-weight:700;}
.hist-day-body{display:none;padding:0 14px 12px;}
.hist-day-body.open{display:block;}
.hist-exo-row{padding:7px 0;border-bottom:1px solid var(--bg3);}
.hist-exo-row:last-child{border-bottom:none;}
.hist-exo-name{font-size:12px;font-weight:700;margin-bottom:2px;}
.hist-exo-sets{font-size:11px;color:var(--gr);}

/* STATS / GRAPHS */
.exo-picker{width:100%;background:var(--bg2);border:1.5px solid var(--bd);border-radius:9px;color:var(--wh);font-size:13px;padding:10px 12px;margin-bottom:12px;}
.chart-wrap{background:var(--bg1);border-radius:13px;padding:14px;border:1px solid var(--bd);margin:0 12px 10px;}
.pr-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 12px 10px;}
.pr-box{background:var(--bg1);border-radius:12px;padding:13px;border:1px solid var(--bd);}
.pr-exo{font-size:10px;color:var(--gr);margin-bottom:3px;}
.pr-val{font-size:18px;font-weight:800;color:var(--ye);}
.pr-date{font-size:9px;color:var(--gr);margin-top:2px;}

/* EVOLUTION / PHOTOS */
.evo-upload{margin:10px 12px 0;background:var(--bg1);border:2px dashed var(--bd);border-radius:13px;padding:24px;text-align:center;cursor:pointer;}
.evo-upload-ico{font-size:32px;margin-bottom:8px;}
.evo-upload-txt{font-size:12px;color:var(--gr);}
.evo-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 12px 0;}
.evo-photo{background:var(--bg1);border-radius:12px;overflow:hidden;border:1px solid var(--bd);position:relative;}
.evo-photo img{width:100%;height:160px;object-fit:cover;display:block;}
.evo-photo-date{padding:8px 10px;font-size:10px;color:var(--gr);}
.evo-photo-del{position:absolute;top:6px;right:6px;width:24px;height:24px;background:rgba(0,0,0,.7);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;color:#c00;cursor:pointer;}
.measure-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
.measure-box{background:var(--bg2);border-radius:9px;padding:10px;}
.measure-lbl{font-size:9px;color:var(--gr);margin-bottom:4px;}
.measure-input{width:100%;background:var(--bg3);border:1.5px solid var(--bd);border-radius:7px;color:var(--ye);font-size:15px;font-weight:800;text-align:center;padding:6px;-moz-appearance:textfield;}
.measure-input:focus{outline:none;border-color:var(--or);}
.measure-unit{font-size:9px;color:var(--gr);text-align:center;margin-top:2px;}

.empty{padding:30px 20px;text-align:center;color:var(--gr);font-size:13px;}
.section-label{margin:14px 12px 8px;font-size:9px;color:var(--gr);text-transform:uppercase;letter-spacing:.14em;font-weight:700;}
.hidden-input{display:none;}

/* ROUTINES */
.routine-card{margin:0 12px 10px;background:var(--bg1);border-radius:14px;border:1px solid var(--bd);overflow:hidden;}
.routine-hero{padding:16px;position:relative;overflow:hidden;}
.routine-tag{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;margin-bottom:3px;}
.routine-name{font-size:19px;font-weight:800;margin-bottom:3px;letter-spacing:-.02em;}
.routine-desc{font-size:11px;color:var(--gr);margin-bottom:10px;}
.routine-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.routine-pill{padding:3px 9px;border-radius:20px;font-size:9px;font-weight:700;text-transform:uppercase;background:var(--bg2);color:var(--gr);border:1px solid var(--bd);}
.routine-exo-preview{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;}
.routine-exo-chip{flex:0 0 auto;background:var(--bg2);border-radius:8px;padding:6px 10px;font-size:10px;color:#ccc;border:1px solid var(--bd);white-space:nowrap;}
.routine-start-btn{width:100%;padding:12px;border:none;border-radius:11px;font-weight:800;font-size:14px;cursor:pointer;color:#fff;}
.routine-start-btn:active{transform:scale(.97);}
.routine-done-badge{display:inline-flex;align-items:center;gap:4px;background:#0a1200;color:var(--ye);font-size:9px;font-weight:700;padding:3px 9px;border-radius:20px;border:1px solid var(--ye)33;margin-left:6px;}
.week-selector{display:flex;align-items:center;justify-content:space-between;margin:10px 12px;background:var(--bg1);border-radius:11px;padding:10px 14px;border:1px solid var(--bd);}
.week-arrow{width:30px;height:30px;background:var(--bg2);border:1px solid var(--bd);border-radius:8px;color:var(--gr);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.week-label{font-size:13px;font-weight:800;}
.exo-detail-card{background:var(--bg2);border-radius:10px;padding:10px 12px;margin-bottom:7px;}
.exo-detail-name{font-size:12px;font-weight:700;margin-bottom:2px;}
.exo-detail-meta{font-size:10px;color:var(--gr);}
.exo-detail-tip{font-size:10px;color:#888;margin-top:5px;line-height:1.5;border-left:2px solid var(--or);padding-left:8px;}

/* POST-WORKOUT SUMMARY (style MyFitCoach) */
.summary-wrap{margin:14px 12px;background:linear-gradient(135deg,#0a1400,#0a1000);border:2px solid var(--ye);border-radius:16px;padding:22px 18px;text-align:center;}
.summary-ico{font-size:44px;margin-bottom:8px;}
.summary-title{font-size:24px;font-weight:800;color:var(--ye);margin-bottom:4px;}
.summary-sub{font-size:11px;color:var(--gr);margin-bottom:18px;}
.summary-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.summary-stat{background:var(--bg1);border-radius:11px;padding:12px;border:1px solid var(--bd);}
.summary-stat-val{font-size:20px;font-weight:800;}
.summary-stat-lbl{font-size:9px;color:var(--gr);text-transform:uppercase;margin-top:2px;}
.summary-pr-list{text-align:left;margin-bottom:14px;}
.summary-pr-title{font-size:10px;color:var(--ye);font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;}
.summary-pr-item{display:flex;align-items:center;gap:8px;background:var(--bg1);border-radius:9px;padding:9px 12px;margin-bottom:6px;border-left:3px solid var(--ye);}
.summary-pr-ico{font-size:16px;}
.summary-pr-text{font-size:12px;color:#ddd;}
.summary-exo-compare{text-align:left;margin-bottom:14px;}
.summary-compare-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #1a1a00;}
.summary-compare-item:last-child{border-bottom:none;}
.compare-name{font-size:11px;color:#ccc;}
.compare-trend{font-size:11px;font-weight:800;}
.compare-up{color:var(--ye);}
.compare-same{color:var(--gr);}
.compare-down{color:#c00;}

/* EXERCISE VISUAL */
.exo-visual{width:100%;height:110px;background:#0d0d0d;border-radius:10px;overflow:hidden;margin-bottom:10px;border:1px solid var(--bd);}
.exo-visual svg{width:100%;height:100%;display:block;}
.routine-exo-chip-visual{width:44px;height:44px;border-radius:8px;overflow:hidden;background:#0d0d0d;flex-shrink:0;margin-right:6px;}
.routine-exo-chip-visual svg{width:100%;height:100%;display:block;}
.routine-exo-chip-v2{display:flex;align-items:center;gap:0;flex:0 0 auto;background:var(--bg2);border-radius:8px;padding:4px 10px 4px 4px;border:1px solid var(--bd);}

/* ANIMATIONS DE MOUVEMENT — simulent une vidéo en boucle */
.exo-visual svg{overflow:visible;}
@keyframes pushup{0%,100%{transform:translateY(0);}50%{transform:translateY(10px);}}
@keyframes pullup{0%,100%{transform:translateY(0);}50%{transform:translateY(-14px);}}
@keyframes dip{0%,100%{transform:translateY(0);}50%{transform:translateY(14px);}}
@keyframes squat{0%,100%{transform:translateY(0) scaleY(1);transform-origin:100px 118px;}50%{transform:translateY(16px) scaleY(0.85);transform-origin:100px 118px;}}
@keyframes curl{0%,100%{transform:rotate(0deg);transform-origin:90px 50px;}50%{transform:rotate(35deg);transform-origin:90px 50px;}}
@keyframes curlR{0%,100%{transform:rotate(0deg);transform-origin:110px 50px;}50%{transform:rotate(-35deg);transform-origin:110px 50px;}}
@keyframes press{0%,100%{transform:translateY(0);}50%{transform:translateY(-16px);}}
@keyframes lateral{0%,100%{transform:rotate(0deg);transform-origin:100px 60px;}50%{transform:rotate(-25deg);transform-origin:100px 60px;}}
@keyframes lunge{0%,100%{transform:translateY(0);}50%{transform:translateY(10px);}}
@keyframes rowpull{0%,100%{transform:translateX(0);}50%{transform:translateX(-14px);}}
.anim-pushup{animation:pushup 1.6s ease-in-out infinite;}
.anim-pullup{animation:pullup 1.6s ease-in-out infinite;}
.anim-dip{animation:dip 1.6s ease-in-out infinite;}
.anim-squat{animation:squat 1.8s ease-in-out infinite;}
.anim-curl-l{animation:curl 1.4s ease-in-out infinite;}
.anim-curl-r{animation:curlR 1.4s ease-in-out infinite;}
.anim-press{animation:press 1.6s ease-in-out infinite;}
.anim-lateral{animation:lateral 1.6s ease-in-out infinite;}
.anim-lunge{animation:lunge 1.6s ease-in-out infinite;}
.anim-row{animation:rowpull 1.5s ease-in-out infinite;}
.video-badge{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);color:var(--ye);font-size:8px;font-weight:700;padding:3px 7px;border-radius:12px;display:flex;align-items:center;gap:3px;}
.exo-visual{position:relative;}

.video-link-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;background:linear-gradient(135deg,#c4302b,#8b0000);border:none;border-radius:10px;color:#fff;font-weight:800;font-size:13px;cursor:pointer;margin-bottom:9px;text-decoration:none;}
.video-link-btn:active{transform:scale(.97);}
.video-link-ico{font-size:16px;}

.adapt-badge{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:800;padding:3px 8px;border-radius:20px;margin-top:4px;}
.adapt-up{background:#0a1200;color:var(--ye);border:1px solid var(--ye)44;}
.adapt-same{background:var(--bg2);color:var(--gr);border:1px solid var(--bd);}
.adapt-down{background:#1a0a00;color:#ff8866;border:1px solid #ff886644;}
.adapt-new{background:var(--bg2);color:var(--bl);border:1px solid var(--bl)33;}
.adapt-explain{font-size:9px;color:var(--gr);margin-top:3px;line-height:1.4;}

.state-card{margin:10px 12px 0;background:var(--bg1);border-radius:13px;padding:14px 15px;border:1px solid var(--bd);}
.state-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--gr);margin-bottom:10px;}
.state-sub{font-size:9px;color:var(--gr);margin:10px 0 7px;text-transform:uppercase;letter-spacing:.08em;}
.state-row{display:flex;gap:6px;flex-wrap:wrap;}
.state-btn{flex:1;min-width:80px;padding:9px 8px;background:var(--bg2);border:1.5px solid var(--bd);border-radius:9px;font-size:12px;font-weight:700;color:var(--gr);cursor:pointer;text-align:center;}
.state-btn.active{background:var(--or);border-color:var(--or);color:#fff;}
.injury-chip{padding:7px 12px;background:var(--bg2);border:1.5px solid var(--bd);border-radius:20px;font-size:11px;font-weight:700;color:var(--gr);cursor:pointer;}
.injury-chip.active{background:#c0392b;border-color:#c0392b;color:#fff;}
.avoid-card{background:#1a0000;border:1.5px solid #c0392b55;border-radius:12px;padding:13px 15px;margin-bottom:8px;}
.avoid-title{font-size:12px;font-weight:800;color:#ff6b5b;margin-bottom:4px;}
.avoid-text{font-size:11px;color:#ccc;margin-bottom:10px;line-height:1.5;}
.avoid-actions{display:flex;gap:8px;}
.avoid-btn{flex:1;padding:9px;border:none;border-radius:9px;font-size:11px;font-weight:700;cursor:pointer;}
.avoid-btn-skip{background:var(--bg2);color:var(--gr);border:1px solid var(--bd);}
.avoid-btn-light{background:#c0392b;color:#fff;}
.fatigue-note{font-size:10px;color:var(--pu);background:#1a0025;border-radius:7px;padding:6px 10px;margin-bottom:8px;}

.actions{display:flex;gap:6px;margin:0 12px 8px;}
.act-btn{flex:1;padding:9px;background:var(--bg1);border:1px solid var(--bd);border-radius:9px;color:var(--gr);font-size:10px;font-weight:700;cursor:pointer;text-align:center;}
.act-btn:active{transform:scale(.96);}

.sync-badge{position:fixed;top:10px;right:10px;z-index:150;font-size:9px;font-weight:700;padding:4px 9px;border-radius:20px;display:flex;align-items:center;gap:4px;transition:opacity .3s;}
.sync-ok{background:#0a1a00;color:var(--gn);border:1px solid var(--gn)44;}
.sync-pending{background:var(--bg2);color:var(--gr);border:1px solid var(--bd);}
.sync-error{background:#1a0a00;color:#ff8866;border:1px solid #ff886644;}
</style>
</head>

<div id="app"></div>
<div id="sync-badge" class="sync-badge sync-pending">☁️ …</div>
<script>
// ═══════════════════════════════════════════════
// EXERCICES DISPONIBLES (basés sur ton programme)
// ═══════════════════════════════════════════════
const EXERCISES=[
  "Dips","Tractions Pronation","Tractions Supination","Pompes","Pompes Archer","Pompes Diamant",

  "Presse à Cuisses","Développé Militaire","Tirage Vertical","Rowing Inversé","Muscle-Up","Autre"
];


const ROUTINES=[
  {id:0,label:"LUN",tag:"JOUR A",col:"#FF4D00",focus:"Pecs · Épaules · Triceps",
   desc:"Développé incliné · Développé couché · Épaules · Triceps",timeMin:60,
   exos:[
     {name:"Développé Incliné Haltères",sets:4,target:"6–10",tip:"Banc à 30-45°. Descends contrôlé, pousse en contractant les pecs hauts."},
     {name:"Développé Couché",sets:3,target:"6–10",tip:"Coudes à 45° du corps. Descends jusqu'au sternum, pousse explosif."},

     {name:"Extension Triceps Poulie",sets:3,target:"10–15",tip:"Coudes fixes au corps. Extension complète, contraction en bas."},
     {name:"Extension Triceps au-dessus de la Tête",sets:2,target:"12–15",tip:"Haltère ou corde derrière la tête. Coudes fixes, extension complète."},
   ]},
  {id:1,label:"MAR",tag:"JOUR B",col:"#4D9FFF",focus:"Dos · Biceps · Abdos",
   desc:"Tractions · Rowing · Face pull · Curl · Gainage",timeMin:60,

const ALL_CHAINS={PUSH_CHAIN,LEG_CHAIN,DIPS_CHAIN,PULL_PRO_CHAIN,PULL_SUP_CHAIN};

function chainHitTop(entry,levelDef){
  const validSets=entry.sets.filter(s=>s.reps!==""&&s.reps!==null);
  if(!validSets.length)return false;
  const reps=validSets.map(s=>parseInt(s.reps)||0);
  const minReps=Math.min(...reps);
  const rangeMatch=levelDef.target.match(/(\d+)[–\-](\d+)/);
  if(!rangeMatch)return false;
  const highTarget=parseInt(rangeMatch[2]);
  return minReps>=highTarget;
}

function getChainLevel(chain){
  const allHist=[];
  state.workouts.forEach(w=>{
    w.exercises.forEach(e=>allHist.push({date:w.date,name:e.name,sets:e.sets}));
  });
  allHist.sort((a,b)=>a.date.localeCompare(b.date));

  let level=0,streak=0;
  const ADVANCE_THRESHOLD=2;
  allHist.forEach(entry=>{
    if(level>=chain.length-1)return;
    if(entry.name!==chain[level].name)return;
    if(chainHitTop(entry,chain[level])){
      streak++;
      if(streak>=ADVANCE_THRESHOLD){level=Math.min(level+1,chain.length-1);streak=0;}
    }else{
      streak=0;
    }
  });
  return level;
}

function resolveExo(slot){
  let base;
  if(slot.chain){
    const chain=ALL_CHAINS[slot.chain];
    const level=getChainLevel(chain);
    const def=chain[level];
    base={name:def.name,tip:def.tip,sets:slot.sets,target:def.target,chainLevel:level,chainMax:chain.length-1,chainKey:slot.chain};
  }else if(slot.pool){
    const idx=getWeekIndex()%slot.pool.length;
    const variant=slot.pool[idx];
    base={name:variant.name,tip:variant.tip,sets:slot.sets,target:slot.target};
  }else{
    base=slot;
  }
  const adapt=applyDailyAdaptation(base.name,base.sets);
  return{...base,sets:adapt.sets,avoid:adapt.avoid,fatigueNote:adapt.fatigueNote};
}
function resolveRoutineExos(r){
  return r.exos.map(resolveExo);
}
function getWeekIndex(){
  const d=new Date();
  const start=new Date(d.getFullYear(),0,1);
  const days=Math.floor((d-start)/86400000);
  return Math.floor((days+start.getDay())/7);
}

function checkDailyReset(){
  if(state.stateDate!==today()){
    state.stateDate=today();
    state.energy="normal";
    state.injury="Aucune";
    save();
  }
}
function setEnergy(v){state.energy=v;save();renderApp();}
function setInjury(v){state.injury=v;save();renderApp();}

function applyDailyAdaptation(name,baseSets){
  let sets=baseSets;
  let fatigueNote=null;
  if(state.energy==="fatigue"&&baseSets>1){
    sets=Math.max(1,baseSets-1);
    fatigueNote="Volume réduit d'1 série — fatigue signalée aujourd'hui";
  }
  const tags=getBodyTags(name);
  const avoid=state.injury&&state.injury!=="Aucune"&&tags.includes(state.injury.toLowerCase());
  return{sets,fatigueNote,avoid};
}

let syncState="pending"; // pending | ok | error | offline
function load(){
  try{
    const s=localStorage.getItem(KEY);
    if(s){const d=JSON.parse(s);Object.assign(state,{
      profile:d.profile||state.profile,
      workouts:d.workouts||[],
      measurements:d.measurements||[],
      photos:d.photos||[],
    });}
  }catch(e){}
  if(!state.profile.startDate)state.profile.startDate=today();
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify({
    profile:state.profile,workouts:state.workouts,measurements:state.measurements,photos:state.photos
  }));}catch(e){}
  saveToCloud();
}
function saveToCloud(){
  if(!window.fbDb)return;
  try{
    const docRef=window.fbDoc(window.fbDb,"users","ada");
    window.fbSetDoc(docRef,{
      profile:state.profile,
      workouts:state.workouts,
      measurements:state.measurements,
      photos:state.photos,
      lastSync:new Date().toISOString()
    }).then(()=>{syncState="ok";updateSyncBadge();})
      .catch(e=>{console.log("Cloud save failed:",e);syncState="error";updateSyncBadge();});
  }catch(e){console.log("saveToCloud error:",e);syncState="error";updateSyncBadge();}
}
async function loadFromCloud(){
  if(!window.fbDb)return false;
  try{
    const docRef=window.fbDoc(window.fbDb,"users","ada");
    const snap=await window.fbGetDoc(docRef);
    if(snap.exists()){
      const d=snap.data();
      state.profile=d.profile||state.profile;
      state.workouts=d.workouts||[];
      state.measurements=d.measurements||[];
      state.photos=d.photos||[];
      try{localStorage.setItem(KEY,JSON.stringify({
        profile:state.profile,workouts:state.workouts,measurements:state.measurements,photos:state.photos
      }));}catch(e){}
      syncState="ok";
      return true;
    }
    syncState="ok"; // pas encore de données cloud, mais connexion OK
    return false;
  }catch(e){
    console.log("Cloud load failed:",e);
    syncState="error";
    return false;
  }
}
function updateSyncBadge(){
  const el=document.getElementById("sync-badge");
  if(!el)return;
  const cfg={
    ok:{cls:"sync-ok",label:"☁️ Synchronisé"},
    pending:{cls:"sync-pending",label:"☁️ Connexion…"},
    error:{cls:"sync-error",label:"⚠️ Hors ligne (local uniquement)"},
  }[syncState]||{cls:"sync-pending",label:"☁️ …"};
  el.className="sync-badge "+cfg.cls;
  el.textContent=cfg.label;
}
async function initApp(){
  load();
  renderApp();
  try{
    const fb=await window.firebaseReadyPromise;
    if(fb){
      window.fbDb=fb.db;window.fbDoc=fb.doc;window.fbGetDoc=fb.getDoc;window.fbSetDoc=fb.setDoc;
      const got=await loadFromCloud();
      updateSyncBadge();
      if(got)renderApp();
    }else{
      syncState="error";updateSyncBadge();
    }
  }catch(e){
    console.log("initApp firebase error:",e);
    syncState="error";updateSyncBadge();
  }
}

// ═══════════════════════════════════════════════
// MOTEUR D'AJUSTEMENT AUTOMATIQUE (progression hebdo)
// ═══════════════════════════════════════════════
function getExoHistory(name){
  // Toutes les occurrences de cet exercice, triées par date
  const occ=[];
  state.workouts.forEach(w=>{
    w.exercises.forEach(e=>{
      if(e.name===name)occ.push({date:w.date,sets:e.sets});
    });
  });
  return occ.sort((a,b)=>a.date.localeCompare(b.date));
}

function computeAdaptiveTarget(name,baseTarget,baseSets){
  const hist=getExoHistory(name);
  if(!hist.length)return{target:baseTarget,sets:baseSets,trend:"new",reason:"Objectif de départ — pas encore de données"};

  const last=hist[hist.length-1];
  const validSets=last.sets.filter(s=>s.reps!==""&&s.reps!==null);
  if(!validSets.length)return{target:baseTarget,sets:baseSets,trend:"same",reason:"Dernière séance incomplète"};

  const reps=validSets.map(s=>parseInt(s.reps)||0);
  const weights=validSets.map(s=>parseFloat(s.weight)||0);
  const avgReps=reps.reduce((a,b)=>a+b,0)/reps.length;
  const maxWeight=Math.max(...weights);
  const minReps=Math.min(...reps);

  // Parse la cible de base (ex: "5–6" -> [5,6], "Max" -> null, "12–15" -> [12,15])
  const rangeMatch=baseTarget.match(/(\d+)[–\-](\d+)/);
  const isBodyweightExo=isBodyweight(name);

  if(!rangeMatch){
    // Cible "Max" — pas d'ajustement de range, juste affiche le dernier score comme référence
    return{target:baseTarget,sets:baseSets,trend:"same",reason:`Dernier record : ${Math.round(avgReps)} reps${maxWeight>0?' à '+maxWeight+'kg':''}`};
  }

  const lowTarget=parseInt(rangeMatch[1]),highTarget=parseInt(rangeMatch[2]);
  const hitTop=minReps>=highTarget;
  const hitAll=minReps>=lowTarget;

  if(hitTop){
    // Toutes les séries au top de la fourchette → progression
    if(isBodyweightExo){
      return{target:baseTarget,sets:baseSets,trend:"up",
        reason:`💪 Semaine dernière : ${minReps}+ reps sur toutes les séries. Ajoute du lest (+2,5kg) ou vise le haut de la fourchette suivante.`};
    }else{
      const newWeight=maxWeight>0?Math.round((maxWeight+2.5)*10)/10:null;
      return{target:baseTarget,sets:baseSets,trend:"up",
        reason:`💪 Objectif atteint sur toutes les séries à ${maxWeight}kg. Essaie ${newWeight}kg cette semaine.`};
    }
  }else if(hitAll){
    return{target:baseTarget,sets:baseSets,trend:"same",
      reason:`✓ Dans la fourchette (min ${minReps} reps). Consolide avant d'augmenter.`};
  }else{
    return{target:baseTarget,sets:baseSets,trend:"down",
      reason:`⚠️ Sous l'objectif (min ${minReps} vs ${lowTarget} visé). Garde la même charge, focus sur la technique.`};
  }
}

function computeStreak(){
  if(!state.workouts.length)return 0;
  const dates=[...new Set(state.workouts.map(w=>w.date))].sort().reverse();
  let streak=0;let cursor=new Date(today());
  for(let i=0;i<dates.length;i++){
    const wd=new Date(dates[i]);
    const diff=Math.round((cursor-wd)/(1000*60*60*24));
    if(diff<=1){streak++;cursor=wd;}else break;
  }
  return streak;
}
function totalVolume(){
  return state.workouts.reduce((tot,w)=>tot+w.exercises.reduce((t2,e)=>
    t2+e.sets.reduce((t3,s)=>t3+(parseFloat(s.weight)||0)*(parseInt(s.reps)||0),0),0),0);
}
function getPRs(){
  const prs={};
  state.workouts.forEach(w=>{
    w.exercises.forEach(e=>{
      e.sets.forEach(s=>{
        const w_=parseFloat(s.weight)||0,r=parseInt(s.reps)||0;
        if(!prs[e.name]||w_>prs[e.name].weight||(w_===prs[e.name].weight&&r>prs[e.name].reps)){
          prs[e.name]={weight:w_,reps:r,date:w.date};
        }
      });
    });
  });
  return prs;
}

function renderChart(){
  const canvas=document.getElementById("prog-chart");
  if(!canvas)return;
  const data=[];
  state.workouts.forEach(w=>{
    w.exercises.forEach(e=>{
      if(e.name===state.statsExo){
        const maxSet=e.sets.reduce((max,s)=>{
          const wt=parseFloat(s.weight)||0;
          return wt>max.weight?{weight:wt,reps:parseInt(s.reps)||0}:max;
        },{weight:0,reps:0});
        data.push({date:w.date,weight:maxSet.weight});
      }
    });
  });
  data.sort((a,b)=>a.date.localeCompare(b.date));
  if(chartInstance){chartInstance.destroy();chartInstance=null;}
  if(!data.length)return;
  chartInstance=new Chart(canvas,{
    type:"line",
    data:{
      labels:data.map(d=>fmtDate(d.date)),
      datasets:[{data:data.map(d=>d.weight),borderColor:"#FF4D00",backgroundColor:"rgba(255,77,0,.12)",tension:.35,pointBackgroundColor:"#C8FF00",pointRadius:5,fill:true}]
    },
    options:{
      plugins:{legend:{display:false}},
      scales:{
        x:{ticks:{color:"#666",font:{size:10}},grid:{color:"#1a1a1a"}},
        y:{ticks:{color:"#666",font:{size:10}},grid:{color:"#1a1a1a"}}
      }
    }
  });
}

function finishWorkout(){
  if(!state.currentLog.exercises.length)return;
  const valid=state.currentLog.exercises.filter(e=>e.sets.some(s=>s.weight!==""||s.reps!==""));
  if(!valid.length){alert("Ajoute au moins un poids ou des reps.");return;}

  // Calcule les PRs AVANT d'ajouter la séance pour détecter les nouveaux records
  const prsBefore=getPRs();

  const vol=valid.reduce((t,e)=>t+e.sets.reduce((t2,s)=>t2+(parseFloat(s.weight)||0)*(parseInt(s.reps)||0),0),0);
  const totalReps=valid.reduce((t,e)=>t+e.sets.reduce((t2,s)=>t2+(parseInt(s.reps)||0),0),0);

  state.workouts.push({id:Date.now(),date:today(),exercises:valid,routineId:state.currentLog.routineId||null});

  // Détecte les nouveaux PR après ajout
  const prsAfter=getPRs();
  const newPRs=[];
  valid.forEach(e=>{
    const before=prsBefore[e.name];
    const after=prsAfter[e.name];
    if(after&&(!before||after.weight>before.weight||(after.weight===before.weight&&after.reps>before.reps))){
      if(!before||after.weight>0)newPRs.push({name:e.name,weight:after.weight,reps:after.reps,isNew:!before});
    }
  });

  // Compare avec la dernière séance de même routine pour tendance
  const routineId=state.currentLog.routineId;
  let comparisons=[];
  if(routineId!==null&&routineId!==undefined){
    const prevWorkouts=state.workouts.filter(w=>w.routineId===routineId).slice(0,-1);
    const prevWorkout=prevWorkouts[prevWorkouts.length-1];
    if(prevWorkout){
      valid.forEach(e=>{
        const prevExo=prevWorkout.exercises.find(x=>x.name===e.name);
        if(prevExo){
          const curMaxW=Math.max(...e.sets.map(s=>parseFloat(s.weight)||0));
          const prevMaxW=Math.max(...prevExo.sets.map(s=>parseFloat(s.weight)||0));
          const curTotalReps=e.sets.reduce((t,s)=>t+(parseInt(s.reps)||0),0);
          const prevTotalReps=prevExo.sets.reduce((t,s)=>t+(parseInt(s.reps)||0),0);
          let trend="same",diff="=";
          if(curMaxW>prevMaxW||curTotalReps>prevTotalReps){trend="up";diff="+"+(curTotalReps-prevTotalReps>0?(curTotalReps-prevTotalReps)+" reps":(curMaxW-prevMaxW)+" kg");}
          else if(curMaxW<prevMaxW||curTotalReps<prevTotalReps){trend="down";diff=(curTotalReps-prevTotalReps)+" reps";}
          comparisons.push({name:e.name,trend,diff});
        }
      });
    }
  }

  state.lastSummary={
    date:today(),
    exerciseCount:valid.length,
    totalVolume:Math.round(vol),
    totalReps,
    newPRs,
    comparisons,
    routineLabel:routineId!==null&&routineId!==undefined?ROUTINES.find(r=>r.id===routineId)?.focus:null
  };

  state.currentLog={exercises:[]};
  state.activeRoutineId=null;
  save();
  state.view="summary";
  renderApp();
}

  const weight=document.getElementById("m-weight").value;
  const chest=document.getElementById("m-chest").value;
  const arms=document.getElementById("m-arms").value;
  const waist=document.getElementById("m-waist").value;
  if(!weight&&!chest&&!arms&&!waist)return;
  state.measurements.push({date:today(),weight,chest,arms,waist});
  save();renderApp();
}

function uploadPhoto(input){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    state.photos.push({id:Date.now(),date:today(),img:e.target.result});
    save();renderApp();
  };
  r.readAsDataURL(f);
}
function deletePhoto(id){
  state.photos=state.photos.filter(p=>p.id!=id);
  save();renderApp();
}


function exportAllData(){
  const backup={
    profile:state.profile,
    workouts:state.workouts,
    measurements:state.measurements,
    photos:state.photos
  };
  const blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=`ada_tracker_backup_${today()}.json`;a.click();
  URL.revokeObjectURL(url);
}
function importAllData(file){
  if(!file)return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(d.workouts)state.workouts=d.workouts;
      if(d.measurements)state.measurements=d.measurements;
      if(d.photos)state.photos=d.photos;
      if(d.profile)state.profile=d.profile;
      save();
      renderApp();
      alert("Données importées avec succès !");
    }catch(err){alert("Fichier invalide.");}
  };
  r.readAsText(file);
}
function clearAllData(){
  if(confirm("Effacer TOUT l'historique, mesures et photos ? Cette action est irréversible.")){
    state.workouts=[];
    state.measurements=[];
    state.photos=[];
    save();
    renderApp();
  }
}

initApp();
</script>
</body>
</html>
